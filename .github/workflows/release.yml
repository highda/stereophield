name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package macOS
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./scripts/package-macos.sh "${GITHUB_REF_NAME#v}"
          else
            ./scripts/package-macos.sh
          fi
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stereophield-macos
          path: build/dist/*

  github-release:
    needs: [macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          body: |
            stereophield Audio Unit for macOS on Apple Silicon (arm64), macOS 12 or later.

            **Install** (no Gatekeeper prompt; checks the SHA-256 before installing):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/highda/stereophield/main/scripts/install-au.sh | bash
            ```

            Or unzip `stereophield-<version>-AU.zip` into `~/Library/Audio/Plug-Ins/Components` and remove the quarantine flag that the browser adds:

            ```bash
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/stereophield.component
            ```

            The plugin is signed ad hoc, not with a Developer ID. Checksums are in the SHA256 file.
